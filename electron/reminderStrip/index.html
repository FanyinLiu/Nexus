<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="strip.css" />
  </head>
  <body>
    <div class="strip" id="strip" role="alert" aria-live="assertive" hidden>
      <svg class="strip__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </svg>
      <button class="strip__text" id="strip-text" type="button"></button>
      <span class="strip__count" id="strip-count" hidden></span>
      <button class="strip__button strip__button--primary" id="strip-done" type="button"></button>
      <button class="strip__button" id="strip-snooze" type="button"></button>
    </div>
    <script src="strip.js"></script>
  </body>
</html>
